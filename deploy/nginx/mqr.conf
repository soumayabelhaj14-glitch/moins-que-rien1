# Nginx — Moins que rien
# Emplacement : /etc/nginx/sites-available/mqr.conf
# Activer : ln -s /etc/nginx/sites-available/mqr.conf /etc/nginx/sites-enabled/
# TLS : certbot --nginx -d votre-domaine.fr (Let's Encrypt, gratuit)
#
# Remplacez VOTRE_DOMAINE par votre nom de domaine réel.

server {
    listen 80;
    server_name VOTRE_DOMAINE www.VOTRE_DOMAINE;

    # Redirection automatique vers HTTPS (certbot complète ce bloc)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name VOTRE_DOMAINE www.VOTRE_DOMAINE;

    # --- TLS (rempli par certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/VOTRE_DOMAINE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/VOTRE_DOMAINE/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- En-têtes de sécurité ---
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Proxy vers l'application TanStack Start (PM2, port 3000) ---
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Logs ---
    access_log /var/log/nginx/mqr.access.log;
    error_log  /var/log/nginx/mqr.error.log;
}
